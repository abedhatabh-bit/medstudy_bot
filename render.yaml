services:
  - type: web
    name: medstudy-bot
    runtime: python
    plan: free
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: APP_URL
        sync: false
      - key: WEBHOOK_MODE
        value: "1"
      - key: PORT
        value: "10000"
      - key: DB_PATH
        value: "medstudy.db"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python bot.py"
    autoDeploy: true
